[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intercom-admin"
version = "1.0.0"
description = "Administration, Provisionierung und Ueberwachung des Stadion-Intercoms"
# Kein readme = "../README.md": der Docker-Bau-Kontext ist ./admin, ein Pfad
# darueber liegt ausserhalb und waere beim Bau nicht vorhanden. setuptools
# uebergeht die fehlende Datei heute stillschweigend -- darauf sollte sich der
# Bau aber nicht verlassen. Die README liegt im Projektstamm.
requires-python = ">=3.11,<3.12"
# Die Obergrenze ist keine Vorsicht, sondern gemessen: zeroc-ice hat auf PyPI
# fuer Linux ueberhaupt kein Wheel und wird aus dem Quelltext gebaut, und das
# Distributionspaket python3-zeroc-ice ist gegen genau eine Python-Version
# gebaut -- in Debian 12 gegen 3.11. Siehe DECISIONS.md (D-008, D-027).

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",

  # zeroc-ice steht BEWUSST NICHT hier, sondern als Extra "ice" weiter unten.

  # Nur fuer das selbstsignierte Client-Zertifikat des Monitor-Bots.
  "cryptography>=42",

  # PyPI kennt nur pymumble 1.6.1 (Mai 2021). Diese Fassung ruft ssl.wrap_socket
  # auf, das ab CPython 3.12 nicht mehr existiert -- unter 3.11 laeuft sie zwar,
  # aber die Version aus dem Standardzweig hat den Fehler behoben und einige
  # weitere. Der Commit ist festgenagelt, damit ein spaeterer Bau dasselbe
  # ergibt. ACHTUNG: der Standardzweig heisst pymumble_py3, NICHT master --
  # master ist toter Python-2-Code.
  "pymumble @ git+https://github.com/azlux/pymumble@a560e6013dfbccb3666ce8756e1ca6b790bf05c8",
]

[project.optional-dependencies]
# Ice kommt aus einer von zwei Quellen, und welche es ist, entscheidet die
# Umgebung -- deshalb ein Extra und keine feste Abhaengigkeit:
#
#   * Im Image aus dem Debian-Paket `python3-zeroc-ice` (3.7.8, gegen Python
#     3.11 gebaut). Das ist der Regelfall und der Grund fuer dieses Extra:
#     Debian legt die Module ab, aber keine pip-Metadaten. Stuende zeroc-ice in
#     `dependencies`, wuerde pip es fuer unbekannt halten und trotzdem aus dem
#     Quelltext bauen -- zehn Minuten C++ fuer etwas, das schon da ist.
#   * Auf einem Arbeitsplatz ohne das Distributionspaket ueber dieses Extra,
#     dann aus dem Quelltext. Feste Version, weil die Slice damit uebersetzt
#     wird und ein Versionssprung die Pruefsummen gegen den Server verschoebe.
#
# Ohne beides scheitert der Import mit "No module named 'Ice'"; die Tests
# ueberspringen sich dann von selbst (siehe tests/conftest.py).
ice = ["zeroc-ice==3.7.11"]

# types-PyYAML gehoert dazu: ohne die Stubs meldet mypy drei Fehler, die
# keine sind -- und ein frisch aufgesetzter Arbeitsplatz sieht damit als
# erstes eine rote Pruefung.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27", "types-PyYAML>=6"]

[project.scripts]
intercom = "intercom.cli:main"

[tool.setuptools.packages.find]
include = ["intercom*"]

# ---------------------------------------------------------------------------
#  ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Von slice2py erzeugt -- wird bei jedem Bau neu geschrieben und niemals von
# Hand angefasst.
extend-exclude = ["slice"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
ignore = [
  # Die Anwendung spricht Deutsch; Umlaute sind in Texten als ae/oe/ue
  # geschrieben, aber Zeichen wie „ und “ tauchen in Meldungen auf.
  "RUF001", "RUF002", "RUF003",
  # Depends(...) im Vorgabewert ist die vorgesehene Schreibweise von FastAPI,
  # kein Versehen.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# Die von slice2py erzeugten Namen sind vorgegeben (getACL, applyHere, ...).
"intercom/ice/client.py" = ["N802", "N803"]
"tests/fake_murmur.py" = ["N802", "N803", "A002"]
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
#  mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Von slice2py erzeugt. Wird bei jedem Bau neu geschrieben, ist nicht
# typannotiert und gehoert niemandem -- pruefen waere sinnlos.
exclude = ["^slice/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
# Von slice2py erzeugt bzw. ohne Typinformationen ausgeliefert.
module = ["MumbleServer.*", "MumbleServer", "Ice", "Ice.*", "pymumble_py3.*", "IcePy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Hier lohnt sich Strenge: reine Logik, keine untypisierten Fremdtypen.
module = ["intercom.provision.*", "intercom.ice.types", "intercom.ice.permissions", "intercom.config"]
strict = true

[[tool.mypy.overrides]]
# Hier ragen untypisierte Ice- und pymumble-Objekte herein; strict waere
# nur ein Wald aus type: ignore.
module = ["intercom.ice.client", "intercom.monitor.*", "intercom.web.*"]
disallow_untyped_defs = true
warn_return_any = false

# ---------------------------------------------------------------------------
#  pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: braucht einen echten mumble-server im Docker (docker compose -f docker-compose.test.yml)",
]
filterwarnings = [
  # pymumble liefert vorgeneriertes protobuf-Zeug aus.
  "ignore::DeprecationWarning:pymumble_py3.*",
  "ignore::DeprecationWarning:google.protobuf.*",
]
