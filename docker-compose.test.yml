# =============================================================================
#  Testaufbau: ein echter Mumble-Server, isoliert vom Betrieb.
#
#      docker compose -f docker-compose.test.yml up -d
#      cd admin && MUMBLE_TEST_ICE_PORT=16502 python -m pytest -m integration
#      docker compose -f docker-compose.test.yml down -v
#
#  Bewusst eigene Ports und ein eigenes Datenverzeichnis, damit ein Testlauf
#  niemals den laufenden Stadion-Server anfasst.
# =============================================================================

services:
  mumble-test:
    image: mumblevoip/mumble-server:${MUMBLE_TEST_VERSION:-v1.5.735}
    container_name: mumble-test
    restart: "no"
    ports:
      - "127.0.0.1:${MUMBLE_TEST_ICE_PORT:-16502}:6502"
      - "127.0.0.1:${MUMBLE_TEST_PORT:-64739}:64739"
    tmpfs:
      - /data
    environment:
      MUMBLE_SUPERUSER_PASSWORD: testtest
      MUMBLE_CONFIG_ICE: '"tcp -h 0.0.0.0 -p 6502"'
      MUMBLE_CONFIG_ICESECRETWRITE: ${MUMBLE_TEST_SECRET:-test-secret}
      MUMBLE_CONFIG_PORT: "64739"
      MUMBLE_CONFIG_OBFUSCATE: "false"
      MUMBLE_CONFIG_LOGLEVEL: "1"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6502' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
